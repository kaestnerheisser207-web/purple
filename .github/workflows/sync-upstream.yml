name: Sync upstream release
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream-release
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'kaestnerheisser207-web/purple'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Mirror latest stable release without merging custom code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(gh api repos/erickochen/purple/releases/latest --jq .tag_name)
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch --no-tags https://github.com/erickochen/purple.git "refs/tags/$tag"
          revision=$(git rev-parse 'FETCH_HEAD^{commit}')
          # Deliberately no force: history changes require human review.
          git push origin "$revision:refs/heads/upstream-release"
          echo "Upstream $tag ($revision) is ready on upstream-release; review before merging into feature/zh-cn." >> "$GITHUB_STEP_SUMMARY"
